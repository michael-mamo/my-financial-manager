name: my_financial_manager
description: Offline personal income, expense, and loan manager (English/Amharic).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Local database
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Formatting / i18n
  intl: any

  # Security
  local_auth: ^2.2.0
  crypto: ^3.0.3
  encrypt: ^5.0.3

  # Files / backup / export
  file_picker: ^8.0.0
  share_plus: ^9.0.0
  pdf: ^3.11.0
  csv: ^6.0.0

  # Charts
  fl_chart: ^0.68.0

  # Notifications

  # Misc
  uuid: ^4.4.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  sqflite_common_ffi: ^2.3.3
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
  generate: true # enables ARB-based l10n code generation (l10n.yaml)
  assets:
    - assets/fonts/
